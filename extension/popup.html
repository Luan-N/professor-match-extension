<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Professor Match Popup</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="current-school-info"></div>
  
    <button id="changeSchoolButton">Change School</button>
  
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">

    <div id="whitelist-section">
      <h3 style="font-size: 14px; margin-bottom: 5px;">Site Permissions</h3>
      <p id="site-status" style="font-size: 12px; color: #666; margin-bottom: 10px;"></p>
    
      <!-- One-click button -->
      <button id="allowCurrentSiteButton" style="background-color: #4CAF50; color: white; width: 100%; margin-bottom: 10px;">
        Enable on this site
      </button>

      <!-- Manual input -->
      <div style="display: flex; gap: 5px; margin-bottom: 10px;">
        <input id="manualDomainInput" type="text" placeholder="example.com" style="flex-grow: 1; padding: 5px;">
        <button id="addDomainButton" style="padding: 5px 10px;">Add</button>
      </div>

      <ul id="domainList" style="padding-left: 20px; font-size: 12px; max-height: 100px; overflow-y: auto;"></ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
